<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Sky Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4fc3f7"/>
      <stop offset="60%" stop-color="#b3e5fc"/>
      <stop offset="100%" stop-color="#e1f5fe"/>
    </linearGradient>

    <!-- Sun Glow -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff59d"/>
      <stop offset="40%" stop-color="#fbc02d"/>
      <stop offset="100%" stop-color="#f57f17" stop-opacity="0"/>
    </radialGradient>

    <!-- Grass Island Gradient -->
    <linearGradient id="grassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#66bb6a"/>
      <stop offset="100%" stop-color="#388e3c"/>
    </linearGradient>

    <!-- Dirt Plot Gradient -->
    <linearGradient id="dirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8d5b2d"/>
      <stop offset="100%" stop-color="#5c3818"/>
    </linearGradient>

    <!-- Barn Red Gradient -->
    <linearGradient id="barnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#b71c1c"/>
    </linearGradient>

    <!-- Soft Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.25"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Sky -->
  <rect width="800" height="450" fill="url(#skyGrad)"/>

  <!-- Sun & Rays -->
  <circle cx="680" cy="90" r="90" fill="url(#sunGlow)"/>
  <circle cx="680" cy="90" r="45" fill="#fff59d"/>

  <!-- Clouds -->
  <g fill="#ffffff" opacity="0.9">
    <!-- Cloud 1 -->
    <path d="M120,80 Q140,55 170,65 Q195,50 220,70 Q245,65 250,85 Q260,105 240,115 L120,115 Z"/>
    <!-- Cloud 2 -->
    <path d="M460,50 Q475,30 500,38 Q520,25 540,42 Q560,38 565,55 Q575,70 555,80 L460,80 Z"/>
  </g>

  <!-- Floating Green Island / Hills -->
  <ellipse cx="400" cy="380" rx="420" ry="170" fill="#2e7d32" opacity="0.3"/>
  <path d="M-40,260 Q180,210 400,240 Q620,210 840,260 L840,450 L-40,450 Z" fill="url(#grassGrad)" filter="url(#dropShadow)"/>

  <!-- Cobblestone Path -->
  <path d="M380,450 Q390,340 430,300 Q470,260 500,240" stroke="#b0bec5" stroke-width="28" fill="none" stroke-linecap="round"/>
  <path d="M380,450 Q390,340 430,300 Q470,260 500,240" stroke="#78909c" stroke-width="24" stroke-dasharray="14,14" fill="none" stroke-linecap="round"/>

  <!-- Red Barn on the Right -->
  <g transform="translate(520, 160)" filter="url(#dropShadow)">
    <!-- Base -->
    <polygon points="40,90 140,90 140,170 40,170" fill="url(#barnGrad)"/>
    <polygon points="140,90 210,50 210,130 140,170" fill="#8e0000"/>
    <!-- Roof -->
    <polygon points="15,90 90,30 165,90" fill="#37474f"/>
    <polygon points="90,30 165,90 235,50 160,-10" fill="#263238"/>
    <!-- Barn Door -->
    <rect x="70" y="115" width="40" height="55" fill="#ffffff"/>
    <path d="M70,115 L110,170 M110,115 L70,170" stroke="#b71c1c" stroke-width="4"/>
    <!-- Loft Window -->
    <polygon points="90,50 78,70 102,70" fill="#ffffff"/>
  </g>

  <!-- Windmill on the Left -->
  <g transform="translate(100, 140)" filter="url(#dropShadow)">
    <polygon points="50,190 65,80 95,80 110,190" fill="#efebe9"/>
    <polygon points="60,80 80,45 100,80" fill="#8d6e63"/>
    <!-- Blades -->
    <circle cx="80" cy="80" r="8" fill="#4e342e"/>
    <line x1="80" y1="80" x2="30" y2="30" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <line x1="80" y1="80" x2="130" y2="130" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <line x1="80" y1="80" x2="130" y2="30" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <line x1="80" y1="80" x2="30" y2="130" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Farming Plots (Isometric Center) -->
  <g transform="translate(230, 270)" filter="url(#dropShadow)">
    <!-- Plot 1 (Carrots) -->
    <polygon points="60,0 130,35 70,70 0,35" fill="url(#dirtGrad)"/>
    <text x="60" y="45" font-size="32" text-anchor="middle">🥕</text>

    <!-- Plot 2 (Wheat) -->
    <polygon points="140,40 210,75 150,110 80,75" fill="url(#dirtGrad)"/>
    <text x="145" y="85" font-size="34" text-anchor="middle">🌾</text>

    <!-- Plot 3 (Tomatoes) -->
    <polygon points="140,0 210,35 150,70 80,35" fill="url(#dirtGrad)"/>
    <text x="145" y="45" font-size="32" text-anchor="middle">🍅</text>

    <!-- Plot 4 (Pumpkins) -->
    <polygon points="60,40 130,75 70,110 0,75" fill="url(#dirtGrad)"/>
    <text x="65" y="88" font-size="34" text-anchor="middle">🎃</text>
  </g>

  <!-- Cute Animals -->
  <g transform="translate(190, 370)">
    <text x="0" y="0" font-size="38">🐔</text>
    <text x="35" y="15" font-size="28">🐣</text>
    <text x="360" y="20" font-size="42">🐕</text>
    <text x="420" y="-10" font-size="46">🐮</text>
  </g>

  <!-- Title Badge Overlay -->
  <g transform="translate(400, 75)" filter="url(#dropShadow)">
    <rect x="-240" y="-35" width="480" height="70" rx="35" fill="rgba(24, 18, 14, 0.88)" stroke="#ffe082" stroke-width="3"/>
    <text x="0" y="10" fill="#fff8e7" font-family="'Segoe UI', system-ui, sans-serif" font-size="34" font-weight="900" text-anchor="middle" letter-spacing="1">
      🌾 GRANJA MÁGICA 3D ✨
    </text>
  </g>

  <!-- Subtitle Tag -->
  <g transform="translate(400, 125)">
    <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#ff9800"/>
    <text x="0" y="5" fill="#211103" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">
      COZY 3D FARM ADVENTURE
    </text>
  </g>
</svg>
