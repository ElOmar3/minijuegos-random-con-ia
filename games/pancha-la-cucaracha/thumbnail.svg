<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <defs>
    <radialGradient id="lamp" cx="55%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ffe9b0" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffe9b0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d8cfbe"/>
      <stop offset="100%" stop-color="#b8ac97"/>
    </linearGradient>
  </defs>

  <!-- Piso de baldosas -->
  <rect width="640" height="360" fill="url(#floor)"/>
  <g stroke="#a89c86" stroke-width="2" opacity="0.5">
    <path d="M0 90 H640 M0 180 H640 M0 270 H640"/>
    <path d="M80 0 V360 M160 0 V360 M240 0 V360 M320 0 V360 M400 0 V360 M480 0 V360 M560 0 V360"/>
  </g>

  <!-- Luz de lámpara -->
  <rect width="640" height="360" fill="url(#lamp)"/>

  <!-- Muebles -->
  <rect x="20" y="20" width="220" height="56" fill="#7a5230" stroke="#4d3018" stroke-width="3"/>
  <rect x="420" y="24" width="190" height="52" fill="#8a5a2e" stroke="#5f3a1a" stroke-width="3"/>

  <!-- Nido -->
  <ellipse cx="600" cy="70" rx="34" ry="26" fill="#1a120a" stroke="#332413" stroke-width="5"/>

  <!-- Migas -->
  <g fill="#e8c07a" stroke="#b58a44" stroke-width="2">
    <polygon points="300,150 315,142 328,152 322,166 305,164"/>
    <polygon points="450,220 462,214 472,224 464,236 451,232"/>
    <polygon points="180,260 192,254 200,264 192,274 181,270"/>
  </g>

  <!-- Sombra de advertencia -->
  <circle cx="380" cy="250" r="52" fill="#0a0500" opacity="0.35"/>

  <!-- Chancla -->
  <g transform="translate(340,210) rotate(-18) scale(2.4)">
    <path d="M-14 -26 C-26 -18 -24 14 -12 24 C0 32 16 26 18 12 C20 -4 16 -22 6 -27 Z"
          fill="#c98b4e" stroke="#5f3413" stroke-width="3"/>
    <path d="M-10 -14 Q6 -6 8 10" fill="none" stroke="#8a4f22" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Pancha -->
  <g transform="translate(120,300) scale(2.6)">
    <g stroke="#2e1a08" stroke-width="3" fill="none">
      <path d="M-8 -2 L-22 -10 M-9 4 L-23 8 M8 -2 L22 -10 M9 4 L23 8"/>
      <path d="M-4 -14 Q-14 -26 -20 -30 M4 -14 Q14 -26 20 -30" stroke-width="2"/>
    </g>
    <ellipse cx="0" cy="0" rx="11" ry="17" fill="#6b3d1c"/>
    <line x1="0" y1="-10" x2="0" y2="14" stroke="#28140a" stroke-width="2"/>
    <ellipse cx="0" cy="-15" rx="5" ry="6" fill="#3a2008"/>
    <path d="M-6 -6 A9 9 0 0 1 2 -13" fill="none" stroke="#ffdc96" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- Título -->
  <rect x="0" y="292" width="640" height="68" fill="#14100c" opacity="0.82"/>
  <text x="24" y="338" font-family="Trebuchet MS, sans-serif" font-size="38" font-weight="bold"
        fill="#ffb340" stroke="#3a2008" stroke-width="1">PANCHA LA CUCARACHA</text>
</svg>
